<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#242429" />
      <stop offset="100%" stop-color="#0f0f12" />
    </radialGradient>
    
    <!-- Rich metallic gold gradient -->
    <linearGradient id="gold-metallic" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b88728" />
      <stop offset="25%" stop-color="#fbe4a0" />
      <stop offset="50%" stop-color="#d1a13b" />
      <stop offset="75%" stop-color="#fdf0cd" />
      <stop offset="100%" stop-color="#9a6b1f" />
    </linearGradient>

    <!-- Subtle drop shadow for the text to give it 3D depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Rounded container representing the logo icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Outer gold border trim to make it feel premium -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold-metallic)" stroke-width="4" opacity="0.3" />

  <!-- RKFI Text styled to match the serif premium cinematic aesthetic -->
  <text x="50%" y="54%" 
        font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" 
        font-size="140" 
        font-weight="900" 
        fill="url(#gold-metallic)" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="4"
        filter="url(#shadow)">RKFI</text>
</svg>
