<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in or create an account to access RKFI Film Institute Registration." />
  <title>Sign In — Rajini Kamal Film Institute (RKFI)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">

  <!-- ─── Auth Container ──────────────────────────────────────── -->
  <div class="auth-backdrop">
    <div class="auth-particles" aria-hidden="true"></div>

    <div class="auth-card" id="authCard">
      <!-- Brand Header -->
      <div class="auth-card__brand">
        <img src="logo.svg" alt="RKFI Logo" class="auth-card__logo" />
        <div>
          <h1 class="auth-card__title">RKFI</h1>
          <p class="auth-card__subtitle">Rajini Kamal Film Institute</p>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab auth-tab--active" id="tabSignIn" type="button">Sign In</button>
        <button class="auth-tab" id="tabSignUp" type="button">Sign Up</button>
        <div class="auth-tab__indicator" id="tabIndicator"></div>
      </div>

      <!-- ── Sign In Form ──────────────────────────────────── -->
      <form id="signInForm" class="auth-form auth-form--active" autocomplete="off" novalidate>
        <div class="auth-form__group">
          <label for="loginEmail" class="auth-form__label">Email Address</label>
          <div class="auth-form__input-wrap">
            <svg class="auth-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/></svg>
            <input type="email" id="loginEmail" name="email" class="auth-form__input" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="auth-form__group">
          <label for="loginPassword" class="auth-form__label">Password</label>
          <div class="auth-form__input-wrap">
            <svg class="auth-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg>
            <input type="password" id="loginPassword" name="password" class="auth-form__input" placeholder="Enter your password" required />
            <button type="button" class="auth-form__toggle-pw" aria-label="Show password" data-target="loginPassword">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-form__button" id="signInBtn">
          <span>Sign In</span>
          <svg class="auth-form__btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

        <div id="signInStatus" class="auth-form__status" role="alert" aria-live="polite"></div>
      </form>

      <!-- ── Sign Up Form ──────────────────────────────────── -->
      <form id="signUpForm" class="auth-form" autocomplete="off" novalidate>
        <div class="auth-form__group">
          <label for="signupName" class="auth-form__label">Full Name</label>
          <div class="auth-form__input-wrap">
            <svg class="auth-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>
            <input type="text" id="signupName" name="name" class="auth-form__input" placeholder="e.g. Adira Menon" required />
          </div>
        </div>

        <div class="auth-form__group">
          <label for="signupEmail" class="auth-form__label">Email Address</label>
          <div class="auth-form__input-wrap">
            <svg class="auth-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/></svg>
            <input type="email" id="signupEmail" name="email" class="auth-form__input" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="auth-form__group">
          <label for="signupPhone" class="auth-form__label">Phone Number</label>
          <div class="auth-form__input-wrap">
            <svg class="auth-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            <input type="tel" id="signupPhone" name="phone" class="auth-form__input" placeholder="+91 98765 43210" />
          </div>
        </div>

        <div class="auth-form__group">
          <label for="signupPassword" class="auth-form__label">Password</label>
          <div class="auth-form__input-wrap">
            <svg class="auth-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg>
            <input type="password" id="signupPassword" name="password" class="auth-form__input" placeholder="Min. 6 characters" required />
            <button type="button" class="auth-form__toggle-pw" aria-label="Show password" data-target="signupPassword">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="auth-form__group">
          <label for="signupConfirm" class="auth-form__label">Confirm Password</label>
          <div class="auth-form__input-wrap">
            <svg class="auth-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg>
            <input type="password" id="signupConfirm" name="confirmPassword" class="auth-form__input" placeholder="Re-enter your password" required />
          </div>
        </div>

        <button type="submit" class="auth-form__button" id="signUpBtn">
          <span>Create Account</span>
          <svg class="auth-form__btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

        <div id="signUpStatus" class="auth-form__status" role="alert" aria-live="polite"></div>
      </form>

      <!-- ── Divider ───────────────────────────────────────── -->
      <div class="auth-divider">
        <span>or continue with</span>
      </div>

      <!-- ── Official Google Sign In ───────────────────────── -->
      <div class="auth-oauth" style="display: flex; justify-content: center;">
        <div id="g_id_onload"
             data-client_id="938133551830-c5jg5or5av4b4h0p1hf5vp7p6mt92cqc.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
      </div>

    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
</body>
</html>
